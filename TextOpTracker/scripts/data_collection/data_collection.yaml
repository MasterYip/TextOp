# Data Collection Configuration for G1 Diffusion Dataset
# This config follows the structure of g1_diffuse.yaml for consistency

defaults:
  - _self_

# Output configuration
output:
  dir: "artifacts/g1_walk"
  zarr_name: "motion.zarr"
  compressor: "disk"  # Use zstd compression for disk storage
  chunk_length: -1  # -1 for auto, or specify chunk size
  sort_by_motion_idx: true  # Sort episodes by motion_idx before saving (ensures motion1: eps0-N, motion2: eps(N+1)-2N, etc.)

# Task and environment configuration
task:
  # name: "Tracking-Flat-G1-ProjGravObs-MNMLP-v0"
  name: "Tracking-Flat-G1-ProjGravObs-MNMLP-CollectData-v0"
  num_envs: 4000
  # max_episode_length: 1000 # unused
  seed: 42

# Policy checkpoint
checkpoint:
  path: "logs/rsl_rl/Pretrained/checkpoints/model_75000.pt"
  load_pickle_cfg: false  # Load env/agent config from pickle files

# Motion data source
motion:
  # pattern: "Data10k-open/*"  # Pattern to match in artifacts directory
  pattern: "selected_motions/*" 
  # Full path: artifacts/{pattern}/motion.npz

# Data collection settings
collection:
  # Collection mode:
  #   - standard: Random sampling with quality filters (default)
  #   - deterministic: M motions × N samples = M*N episodes for full coverage
  mode: "deterministic"
  
  # Standard mode settings (random sampling)
  len_to_save: 1000000  # Total timesteps to collect (standard mode only)
  
  # Deterministic mode settings (M×N sampling)
  samples_per_motion: 50  # N: number of samples per motion (deterministic mode only)
  # In deterministic mode:
  #   - Total episodes = M (num motions) × N (samples_per_motion)
  #   - Each motion sampled exactly N times from start to finish
  #   - Failed episodes reassigned, not counted
  #   - No random start position

  min_episode_length: 100  # Minimum episode length for quality filter
  min_mean_reward: null  # Optional: minimum mean reward per episode

# Action noise injection (following BeyondMimic)
# OU noise creates temporally correlated perturbations for better state diversity
noise:
  enable: true
  type: "ou"  # Ornstein-Uhlenbeck noise
  # OU noise parameters: η_{t+1} = η_t + θ(μ - η_t)Δt + σ√Δt ε_t
  theta: 0.8      # Mean reversion rate
  mu: 0.0         # Long-term mean
  sigma: 0.2      # Joint-wise noise scale
  dt: 0.02         # Time step
  
  # Alternative: Gaussian i.i.d. noise (set type to "gaussian")
  # gaussian_std: 0.1

# Visualization
visualization:
  headless: true
  enable_cameras: false

# Logging
logging:
  print_interval: 100  # Print stats every N steps
  save_metadata: true
