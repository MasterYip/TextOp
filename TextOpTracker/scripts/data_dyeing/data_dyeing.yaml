# Data Dyeing Configuration
# Encodes collected motion data into CLIP latent space using MotionCLIP

# Input dataset configuration
input:
  zarr_path: "../../outputs/collected_data/motion_dataset.zarr"  # Path to collected zarr dataset
  
# MotionCLIP model configuration
motionclip:
  checkpoint_path: "../../../MotionCLIP/exps/g1-model-xyz/checkpoint_0100.pth.tar"
  device: "cuda"  # 'cuda' or 'cpu'
  
# Motion encoding configuration
encoding:
  # FPS conversion settings
  # Collected motion is at origin_fps, but MotionCLIP expects target_fps
  origin_fps: 50  # FPS of collected motion data
  target_fps: 30  # FPS expected by MotionCLIP model
  interp_method: 'linear'  # Interpolation method: 'linear', 'nearest', 'cubic'
  
  # Window size for motion sequence (should match model's num_frames)
  window_size: 60  # frames
  
  # How to handle boundaries (start/end of sequences)
  # Options: 'pad', 'truncate', 'mirror'
  boundary_mode: 'pad'  # FIXME: If using FPS resampling, unknown behavior with `truncate`
  
  # Batch size for encoding (larger = faster but more memory)
  batch_size: 8192
  
  # Pose representation used by the model
  # Options: 'xyz', 'rot6d', 'posquat', 'posvel'
  pose_rep: 'xyz'
  
  # Whether model uses translation
  translation: true
  
  # Whether model uses global orientation
  glob: true
  
  # Whether to use G1 format
  use_g1: true
  
  # Text alignment configuration (bridges semantic gap between motion and text)
  # When enabled, motion embeddings are aligned to text embedding space
  # by computing vocabulary-weighted averages of CLIP text embeddings
  use_text_alignment: false  # Set to true to enable text-aligned embeddings
  vocabulary_path: "text_vocab.yaml"  # Path to vocabulary YAML file

# Output configuration
output:
  # Output zarr path (if same as input, will overwrite)
  zarr_path: "../../outputs/collected_data/motion_dataset_dyed.zarr"
  
  # Name of the field to add to dataset
  latent_field_name: "motion_latent"  # Will add field with shape [T, 512]
  
  # Whether to overwrite existing latent field
  overwrite: true
  
  # Compression settings
  compressor: "default"  # 'default', 'blosc', or null

# Logging
logging:
  verbose: true
  log_interval: 100  # Log every N batches
